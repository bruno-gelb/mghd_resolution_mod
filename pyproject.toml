[project]
name = "mghd-resolution-mod"
# Semantic versioning (https://semver.org).
version = "0.0.1"
description = "Resolution mod for Majesty Gold HD: new screen layouts for ultrawide, 1440p and 4K"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "click==8.5.1",
]

[project.scripts]
mghd-resolution-mod = "mghd_resolution_mod.cli:main"

[project.urls]
Homepage = "https://github.com/bruno-gelb/mghd_resolution_mod"
Issues = "https://github.com/bruno-gelb/mghd_resolution_mod/issues"

# Every dependency is pinned to an exact version here, and with its whole tree in uv.lock.
[dependency-groups]
dev = [
    "capstone==5.0.9",      # src/tools: disassembly
    "pefile==2024.8.26",    # src/tools: reading the exe; build_release.py: checking the version resource
    "pyinstaller==6.22.3",  # release builds
    "pytest==9.2.0",        # tests/
]

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mghd_resolution_mod"

[tool.pytest.ini_options]
testpaths = ["tests"]
